services:
  postgres:
    image: postgres:18
    container_name: agenda-inteligente-postgres
    environment:
      POSTGRES_DB: agenda_inteligente
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql

volumes:
  dados_postgres:
